services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    container_name: ${PROJECT_NAME:-vino-service}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    container_name: ${PROJECT_NAME:-vino-service}-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:${RABBITMQ_IMAGE_TAG:-3.13-management}
    container_name: ${PROJECT_NAME:-vino-service}-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG:-latest}
    container_name: ${PROJECT_NAME:-vino-service}-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:6333/readyz || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.template
    container_name: ${PROJECT_NAME:-vino-service}-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-vino-service}
      APP_VERSION: ${APP_VERSION:-0.1.0}

      FASTAPI__HOST: 0.0.0.0
      FASTAPI__PORT: ${BACKEND_INTERNAL_PORT:-8080}
      FASTAPI__DEBUG: ${FASTAPI_DEBUG:-false}
      FASTAPI__TITLE: ${FASTAPI_TITLE:-vino-back}

      DATABASE__HOST: postgres
      DATABASE__PORT: 5432
      DATABASE__USER: ${POSTGRES_USER:-postgres}
      DATABASE__PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE__DATABASE: ${POSTGRES_DB:-mydb}

      MINIO__HOST: minio
      MINIO__PORT: 9000
      MINIO__ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO__IMAGE_BUCKET: ${MINIO_IMAGE_BUCKET:-images}

      RABBITMQ__HOST: rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ__PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ__VIRTUAL_HOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ__RECOGNITION_QUEUE: ${RABBITMQ_RECOGNITION_QUEUE:-recognition.tasks}

      PARSER__BASE_URL: ${PARSER_BASE_URL:-https://vino-svoe.ru}
      PARSER__TIMEOUT: ${PARSER_TIMEOUT:-10}
      PARSER__MAX_RETRIES: ${PARSER_MAX_RETRIES:-3}
      PARSER__RETRY_DELAY: ${PARSER_RETRY_DELAY:-1}

      LOGGING__LEVEL: ${LOGGING_LEVEL:-INFO}
      LOGGING__LOGS_DIRECTORY: ${LOGGING_LOGS_DIRECTORY:-./logs/}
      LOGGING__FILE: ${LOGGING_FILE:-}
      LOGGING__SERIALIZE: ${LOGGING_SERIALIZE:-false}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_INTERNAL_PORT:-8080}"

  inference:
    build:
      context: ${INFERENCE_BUILD_CONTEXT:-./vino-inference}
      dockerfile: ${INFERENCE_DOCKERFILE:-Dockerfile}
    container_name: ${PROJECT_NAME:-vino-service}-inference
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      INFERENCE__MODEL_WEIGHTS_PATH: ${INFERENCE_MODEL_WEIGHTS_PATH:-/app/best_arcface_model.pth}
      INFERENCE__YOLO_WEIGHTS_PATH: ${INFERENCE_YOLO_WEIGHTS_PATH:-/app/best.pt}
      INFERENCE__EMBEDDING_SIZE: ${INFERENCE_EMBEDDING_SIZE:-512}
      INFERENCE__IMAGE_SIZE: ${INFERENCE_IMAGE_SIZE:-224}
      INFERENCE__DEVICE: ${INFERENCE_DEVICE:-cuda:0}

      QDRANT__USE_LOCAL_PATH: "false"
      QDRANT__HOST: qdrant
      QDRANT__PORT: ${QDRANT_INTERNAL_PORT:-6333}
      QDRANT__GRPC_PORT: ${QDRANT_INTERNAL_GRPC_PORT:-6334}
      QDRANT__PREFER_GRPC: ${QDRANT_PREFER_GRPC:-false}
      QDRANT__COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-wines}

      RABBITMQ__URL: ${RABBITMQ_INFERENCE_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ__CONSUME_QUEUE: ${RABBITMQ_RECOGNITION_QUEUE:-recognition.tasks}
      RABBITMQ__PUBLISH_QUEUE: ${RABBITMQ_RESULT_QUEUE:-recognition.results}
      RABBITMQ__PREFETCH_COUNT: ${RABBITMQ_INFERENCE_PREFETCH_COUNT:-1}

      MINIO__ENDPOINT: minio:9000
      MINIO__ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO__SECURE: ${MINIO_SECURE:-false}
      MINIO__IMAGE_BUCKET: ${MINIO_IMAGE_BUCKET:-images}
      MINIO__IMAGE_PREFIX: ${MINIO_IMAGE_PREFIX:-client}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  qdrant_data: